name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-macos
            os: macos-latest
            rust-target: x86_64-apple-darwin
          - target: aarch64-macos
            os: macos-latest
            rust-target: aarch64-apple-darwin
          - target: x86_64-linux-gnu
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - target: aarch64-linux-gnu
            os: ubuntu-latest
            rust-target: aarch64-unknown-linux-gnu
          - target: x86_64-windows-gnu
            os: ubuntu-latest
            rust-target: x86_64-pc-windows-gnu
          - target: aarch64-windows-gnu
            os: ubuntu-latest
            rust-target: aarch64-pc-windows-gnullvm
          - target: wasm32-freestanding
            os: ubuntu-latest
            rust-target: wasm32-unknown-unknown
          - target: wasm32-wasi
            os: ubuntu-latest
            rust-target: wasm32-wasip1
          - target: x86_64-linux-musl
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-musl
          - target: aarch64-linux-musl
            os: ubuntu-latest
            rust-target: aarch64-unknown-linux-musl

          - target: aarch64-linux-android
            os: ubuntu-latest
            rust-target: aarch64-linux-android
          - target: aarch64-ios
            os: macos-latest
            rust-target: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.667+0569f1f6a

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install cross-compilers (Linux-aarch64)
        if: contains(matrix.target, 'aarch64-linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross-compilers (Windows-mingw)
        if: contains(matrix.target, 'windows-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build Package
        run: |
          cd pkg/temporal
          zig build -Dbuild-rust -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.target }}
          path: pkg/temporal/zig-out/lib/
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-libs
          pattern: lib-*
          merge-multiple: true

      - name: Prepare Release Artifact
        run: |
          mkdir -p release/lib
          cp -r all-libs/* release/lib/
          cd release
          tar -czf ../libtemporal.tar.gz lib/
          zip -r ../libtemporal.zip lib/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libtemporal.tar.gz
            libtemporal.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
